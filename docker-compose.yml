
services:
  # -------------------------
  # PostgreSQL
  # -------------------------
  postgres:
    image: postgres:16-alpine
    container_name: inblack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # -------------------------
  # Redis
  # -------------------------
  redis:
    image: redis:7-alpine
    container_name: inblack-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # -------------------------
  # API Instance 1
  # -------------------------
  api-1:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: inblack-api-1
    restart: unless-stopped
    env_file:
      - .env
    environment:
      INSTANCE_ID: api-1
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------
  # API Instance 2
  # -------------------------
  api-2:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: inblack-api-2
    restart: unless-stopped
    env_file:
      - .env
    environment:
      INSTANCE_ID: api-2
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------
  # Nginx Load Balancer
  # -------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: inblack-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy

  # -------------------------
  # Worker
  # -------------------------
  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    container_name: inblack-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MOCK_GAME_URL: ${MOCK_GAME_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-game:
        condition: service_started

  # -------------------------
  # Mock Payment
  # -------------------------
  mock-pay:
    build:
      context: ./services/mock-pay
      dockerfile: Dockerfile
    container_name: inblack-mock-pay
    restart: unless-stopped
    ports:
      - "4010:4010"

  # -------------------------
  # Mock Game
  # -------------------------
  mock-game:
    build:
      context: ./services/mock-game
      dockerfile: Dockerfile
    container_name: inblack-mock-game
    restart: unless-stopped
    ports:
      - "4020:4020"

  # -------------------------
  # Next.js Frontend
  # -------------------------
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: inblack-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
    depends_on:
      nginx:
        condition: service_started

  # -------------------------
  # Mailpit
  # -------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: inblack-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  postgres_data:
  redis_data:
