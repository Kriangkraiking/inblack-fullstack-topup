# Runs without a .env file: every ${VAR:-default} below is a local test value only.
x-env-file: &env-file
  - path: .env
    required: false

x-api: &api
  image: inblack-api:local
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  init: true
  restart: unless-stopped
  # No env_file here: .env holds POSTGRES_PASSWORD, and only migrate may see the owner's password.
  # Compose still reads .env to fill in the ${VAR} values below.
  depends_on:
    migrate:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    mock-pay:
      condition: service_healthy
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
    interval: 5s
    timeout: 3s
    retries: 5
    start_period: 20s

x-api-env: &api-env
  NODE_ENV: production
  APP_ENV: ${APP_ENV:-development}
  PORT: 3000
  # DNS lookups use libuv's thread pool (4 by default). A lookup of a stopped container's name can
  # hang 5 s, and a full pool then delays Postgres connects too. See AI_LOG, P2.
  UV_THREADPOOL_SIZE: 16
  # inblack_app: not a superuser and not a table owner, see db/migrations/0004_app_role.sql.
  DATABASE_URL: ${DATABASE_URL:-postgresql://inblack_app:${APP_DB_PASSWORD:-change_this_local_app_password}@postgres:5432/${POSTGRES_DB:-inblack_topup}}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  MOCK_PAY_URL: ${MOCK_PAY_URL:-http://mock-pay:4010}
  # Addresses the customer's browser opens, not addresses inside the compose network.
  MOCK_PAY_PUBLIC_URL: ${MOCK_PAY_PUBLIC_URL:-http://localhost:4010}
  WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:3000}
  PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-whsec_test_inblackm_2026}
  # Signs the token that opens GET /api/v1/orders/{id}/events. Local test value; set your own.
  ORDER_EVENTS_TOKEN_SECRET: ${ORDER_EVENTS_TOKEN_SECRET:-test_only_order_events_secret_change_me}
  ORDER_TTL_SECONDS: ${ORDER_TTL_SECONDS:-900}
  ADMIN_SESSION_TTL_SECONDS: ${ADMIN_SESSION_TTL_SECONDS:-28800}
  # Off because compose serves plain http on localhost. Set to true behind TLS.
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  CUSTOMER_SESSION_TTL_SECONDS: ${CUSTOMER_SESSION_TTL_SECONDS:-86400}
  # Origins allowed to send cookie requests that change data (CSRF) and to read answers (CORS).
  CSRF_ALLOWED_ORIGINS: ${CSRF_ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:3000}
  # HMAC key for stored OTP codes. Local test value; set your own.
  OTP_HASH_SECRET: ${OTP_HASH_SECRET:-test_only_otp_hash_secret_change_me}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  MAIL_FROM: ${MAIL_FROM:-no-reply@inblackm.test}

services:
  # -------------------------
  # PostgreSQL
  # -------------------------
  postgres:
    image: postgres:16-alpine
    container_name: inblack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inblack_topup}
      POSTGRES_USER: ${POSTGRES_USER:-inblack_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_local_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  # -------------------------
  # Migrations + seed (one-shot, safe to re-run)
  # -------------------------
  migrate:
    build:
      context: .
      dockerfile: db/Dockerfile
    container_name: inblack-migrate
    init: true
    restart: "no"
    env_file: *env-file
    environment:
      NODE_ENV: production
      # test installs the reset function behind POST /api/v1/_test/reset, anything else drops it.
      APP_ENV: ${APP_ENV:-development}
      # The table owner. api and worker use the restricted role instead.
      DATABASE_URL: ${MIGRATE_DATABASE_URL:-postgresql://${POSTGRES_USER:-inblack_user}:${POSTGRES_PASSWORD:-change_this_local_password}@postgres:5432/${POSTGRES_DB:-inblack_topup}}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-change_this_local_app_password}
    depends_on:
      postgres:
        condition: service_healthy

  # -------------------------
  # Redis
  # -------------------------
  redis:
    image: redis:7-alpine
    container_name: inblack-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # -------------------------
  # API (same image, two instances)
  # -------------------------
  api-1:
    <<: *api
    container_name: inblack-api-1
    environment:
      <<: *api-env
      INSTANCE_ID: api-1

  api-2:
    <<: *api
    container_name: inblack-api-2
    environment:
      <<: *api-env
      INSTANCE_ID: api-2

  # -------------------------
  # Reverse proxy (Nginx round-robin)
  # -------------------------
  proxy:
    # 1.27.3 or later: the upstream `resolve` parameter in nginx.conf needs it.
    image: nginx:1.27.5-alpine
    container_name: inblack-proxy
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    healthcheck:
      # Checks nginx itself, so an API outage does not mark the proxy unhealthy.
      test: ["CMD", "nc", "-z", "127.0.0.1", "80"]
      interval: 5s
      timeout: 3s
      retries: 5

  # -------------------------
  # Worker
  # -------------------------
  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: inblack-worker
    init: true
    restart: unless-stopped
    # No env_file, for the same reason as the API.
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:-development}
      UV_THREADPOOL_SIZE: 16
      DATABASE_URL: ${DATABASE_URL:-postgresql://inblack_app:${APP_DB_PASSWORD:-change_this_local_app_password}@postgres:5432/${POSTGRES_DB:-inblack_topup}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MOCK_GAME_URL: ${MOCK_GAME_URL:-http://mock-game:4020}
      MOCK_PAY_URL: ${MOCK_PAY_URL:-http://mock-pay:4010}
      EXPIRY_SWEEP_INTERVAL_MS: ${EXPIRY_SWEEP_INTERVAL_MS:-5000}
      # See docs/adr/0002-webhook-and-fulfillment-idempotency.md before changing these.
      OUTBOX_POLL_MS: ${OUTBOX_POLL_MS:-1000}
      OUTBOX_CONCURRENCY: ${OUTBOX_CONCURRENCY:-20}
      OUTBOX_LEASE_MS: ${OUTBOX_LEASE_MS:-25000}
      OUTBOX_BACKOFF_CAP_MS: ${OUTBOX_BACKOFF_CAP_MS:-60000}
      RECOVERY_SWEEP_MS: ${RECOVERY_SWEEP_MS:-30000}
      FULFILLMENT_POST_TIMEOUT_MS: ${FULFILLMENT_POST_TIMEOUT_MS:-8000}
      FULFILLMENT_GET_TIMEOUT_MS: ${FULFILLMENT_GET_TIMEOUT_MS:-8000}
      FULFILLMENT_SETTLE_MS: ${FULFILLMENT_SETTLE_MS:-5000}
      FULFILLMENT_MAX_ATTEMPTS: ${FULFILLMENT_MAX_ATTEMPTS:-5}
      FULFILLMENT_MAX_POSTS: ${FULFILLMENT_MAX_POSTS:-3}
      FULFILLMENT_BACKOFF_BASE_MS: ${FULFILLMENT_BACKOFF_BASE_MS:-1000}
      REFUND_MAX_ATTEMPTS: ${REFUND_MAX_ATTEMPTS:-8}
      REFUND_BACKOFF_BASE_MS: ${REFUND_BACKOFF_BASE_MS:-2000}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-game:
        condition: service_healthy
      mock-pay:
        condition: service_healthy
    healthcheck:
      # HeartbeatService touches this file every 30s; stale for 90s means the loop stopped.
      test:
        - CMD
        - node
        - -e
        - "process.exit(Date.now()-require('fs').statSync('/tmp/worker-heartbeat').mtimeMs<90000?0:1)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s

  # -------------------------
  # Mock Payment
  # -------------------------
  mock-pay:
    build:
      context: .
      dockerfile: apps/mock-pay/Dockerfile
    container_name: inblack-mock-pay
    init: true
    restart: unless-stopped
    environment:
      # test turns on POST /_test/reset, which POST /api/v1/_test/reset calls. Off otherwise.
      APP_ENV: ${APP_ENV:-development}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://proxy/api/v1/webhooks/payment}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-whsec_test_inblackm_2026}
    ports:
      - "4010:4010"
    volumes:
      - mock_pay_data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4010/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 5

  # -------------------------
  # Mock Game
  # -------------------------
  mock-game:
    build:
      context: .
      dockerfile: apps/mock-game/Dockerfile
    container_name: inblack-mock-game
    init: true
    restart: unless-stopped
    environment:
      FAIL_RATE: ${FAIL_RATE:-0}
      TIMEOUT_RATE: ${TIMEOUT_RATE:-0}
      SUCCESS_BUT_TIMEOUT_RATE: ${SUCCESS_BUT_TIMEOUT_RATE:-0}
      LATENCY_MS: ${LATENCY_MS:-0}
    ports:
      - "4020:4020"
    volumes:
      - mock_game_data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4020/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 5

  # -------------------------
  # Next.js Frontend
  # -------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: inblack-web
    init: true
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      proxy:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 20s

  # -------------------------
  # Mailpit
  # -------------------------
  mailpit:
    image: axllent/mailpit:v1.33.1
    container_name: inblack-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  mock_pay_data:
  mock_game_data:
