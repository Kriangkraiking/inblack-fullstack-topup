# Throwaway Postgres and Redis for `make integration` on a developer machine.
# Started under its own compose project (inblack-ci-int) with no container_name and
# non-default host ports, so it never collides with the main stack in docker-compose.yml.
# Data lives in tmpfs: every run starts from an empty database, which the
# *.int.spec.ts files expect because they apply db/migrations themselves.
# CI does not use this file; the integration job gets the same images as service containers.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
