# Each proxied request holds two connections, client and upstream. The default of 512 per
# worker reset clients at about 250 requests in parallel, well below a flash sale.
events {
  worker_connections 8192;
}

http {
  upstream api {
    server api-1:3000;
    server api-2:3000;
  }

  server {
    listen 80;

    # Errors nginx produces itself, such as a bad URI or both replicas down. Errors from the
    # API pass through untouched, so the whole system answers in one format.
    error_page 400 @problem_bad_request;
    error_page 502 503 504 =503 @problem_unavailable;

    location @problem_bad_request {
      default_type application/problem+json;
      return 400 '{"type":"urn:inblack:problem:BAD_REQUEST","title":"Bad Request","status":400,"code":"BAD_REQUEST","detail":"Bad Request"}';
    }

    location @problem_unavailable {
      default_type application/problem+json;
      return 503 '{"type":"urn:inblack:problem:SERVICE_UNAVAILABLE","title":"Service Unavailable","status":503,"code":"SERVICE_UNAVAILABLE","detail":"please try again"}';
    }

    location / {
      proxy_pass http://api;
      proxy_connect_timeout 2s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
