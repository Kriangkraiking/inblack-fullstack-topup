# Each proxied request holds two connections, client and upstream. The default of 512 per
# worker reset clients at about 250 requests in parallel, well below a flash sale.
events {
  worker_connections 8192;
}

http {
  upstream api {
    server api-1:3000;
    server api-2:3000;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://api;
      proxy_connect_timeout 2s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
