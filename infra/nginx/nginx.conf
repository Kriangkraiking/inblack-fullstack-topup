# Each proxied request holds two connections, client and upstream. The default of 512 per
# worker reset clients at about 250 requests in parallel, well below a flash sale.
events {
  worker_connections 8192;
}

http {
  # No nginx version in the Server header or in nginx's own error pages.
  server_tokens off;

  # Docker's DNS. A restarted replica can come back on a new IP, and another container can take
  # its old one, so names are looked up again every 5 seconds instead of once at start. The
  # `resolve` parameter (free since nginx 1.27.3) keeps the upstream group, so requests still
  # alternate between both replicas and a dead one is skipped after proxy_connect_timeout.
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 2s;

  # Keeps the client's X-Request-Id and makes one when it is missing. The API accepts only
  # letters, digits and . _ - and replaces anything else with its own id.
  map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
  }

  upstream api {
    zone api_upstream 64k;
    server api-1:3000 resolve;
    server api-2:3000 resolve;
  }

  server {
    listen 80;

    # A settlement CSV can be up to 10 MB, see ReconciliationController. Server wide, because a
    # request sent to an error location below is still checked against this limit there.
    client_max_body_size 11m;

    # Security headers for every answer, the API's and nginx's own (spec 8.4). Set only here, not
    # in Nest. The API serves JSON and SSE, never a page, so the CSP allows nothing at all. HSTS
    # does nothing over this plain-http compose; it matters once TLS sits in front.
    # Locations below must not use add_header, or they stop inheriting these.
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Errors nginx produces itself, such as a bad URI or both replicas down. Errors from the
    # API pass through untouched, so the whole system answers in one format.
    # These must be URIs: a request whose URI nginx rejected gets a 500 from a named location.
    error_page 400 /__problem/bad-request;
    error_page 413 /__problem/too-large;
    error_page 502 503 504 =503 /__problem/unavailable;

    location = /__problem/bad-request {
      default_type application/problem+json;
      return 400 '{"type":"urn:inblack:problem:BAD_REQUEST","title":"Bad Request","status":400,"code":"BAD_REQUEST","detail":"Bad Request"}';
    }

    location = /__problem/too-large {
      default_type application/problem+json;
      return 413 '{"type":"urn:inblack:problem:PAYLOAD_TOO_LARGE","title":"Content Too Large","status":413,"code":"PAYLOAD_TOO_LARGE","detail":"the request body is too large"}';
    }

    location = /__problem/unavailable {
      default_type application/problem+json;
      return 503 '{"type":"urn:inblack:problem:SERVICE_UNAVAILABLE","title":"Service Unavailable","status":503,"code":"SERVICE_UNAVAILABLE","detail":"please try again"}';
    }

    # Prometheus scrapes each replica inside the compose network (api-1:3000/metrics). From
    # outside it is the API's ordinary 404. nginx decodes the URI and merges slashes before it
    # matches, so /%6detrics and //metrics end here too. Case-insensitive and a regex, because
    # the API used to route /METRICS to the same handler (Express matched paths without case);
    # it is the first regex here and no prefix location uses ^~, so it is always checked.
    location ~* ^/+metrics {
      default_type application/problem+json;
      return 404 '{"type":"urn:inblack:problem:NOT_FOUND","title":"Not Found","status":404,"code":"NOT_FOUND","detail":"no such resource"}';
    }

    # SSE: unbuffered so each event leaves at once, HTTP/1.1 to the replica, and a read timeout
    # far above the 15 second heartbeat. The API also sends X-Accel-Buffering: no.
    location ~ ^/api/v1/orders/[^/]+/events$ {
      proxy_pass http://api;
      proxy_connect_timeout 2s;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $req_id;
    }

    # X-Real-IP and X-Forwarded-For are replaced with the connecting address, never appended to,
    # so a client cannot pick the IP that rate limits count against (apps/api/src/security/client-ip.ts).
    location / {
      proxy_pass http://api;
      proxy_connect_timeout 2s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $req_id;
    }
  }
}
