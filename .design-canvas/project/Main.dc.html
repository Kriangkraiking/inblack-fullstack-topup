<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>InBlack Top-Up · Prototype</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;background:var(--bg,#F5F5F7)}
.ib,.ib *{box-sizing:border-box}
.ib button,.ib input,.ib select,.ib textarea{font:inherit;color:inherit}
.ib :focus-visible{outline:3px solid var(--focus,#0B57D0);outline-offset:2px}
.ib a{color:var(--brand-text,#C8102E)}
.ib-p{cursor:pointer;transition:background-color .15s,border-color .15s,box-shadow .15s,transform .15s}
.ib-p:disabled{cursor:not-allowed}
.ib-btn:hover:not(:disabled){background:var(--brand-hover,#A10C24)!important}
.ib-btn2:hover:not(:disabled){background:var(--surface-2,#F1F1F4)!important}
.ib-btnw:hover:not(:disabled){background:var(--brand-soft,#FDE8EB)!important}
.ib-btnh:hover:not(:disabled){background:rgba(255,255,255,.16)!important}
.ib-btnd:hover:not(:disabled){background:#8F1C13!important}
.ib-chip:hover{border-color:var(--brand,#C8102E)!important}
.ib-card:hover{box-shadow:0 6px 20px rgba(20,20,30,.08)!important;transform:translateY(-2px)}
.ib-row:hover{background:var(--surface-2,#F1F1F4)}
.ib-skel{background:linear-gradient(90deg,var(--surface-2,#F1F1F4),var(--border,#E1E1E7),var(--surface-2,#F1F1F4));background-size:200% 100%;animation:ibSh 1.4s ease-in-out infinite;border-radius:8px}
.ib-spin{animation:ibSp .8s linear infinite}
.ib-pulse{animation:ibPu 1.6s ease-in-out infinite}
.ib-in{animation:ibIn .25s ease-out}
.ib-sr{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ib-skip{position:absolute;left:-9999px;top:8px;z-index:50;background:#FFFFFF;color:#C8102E;padding:8px 16px;border-radius:8px;font-weight:700}
.ib-skip:focus{left:16px}
@keyframes ibSh{0%{background-position:100% 0}100%{background-position:-100% 0}}
@keyframes ibSp{to{transform:rotate(360deg)}}
@keyframes ibPu{50%{opacity:.35}}
@keyframes ibIn{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){.ib *{animation:none!important;transition:none!important}.ib-card:hover{transform:none}}
</style>
</helmet>
<div class="ib" style="font-family: 'Noto Sans Thai', 'Leelawadee UI', Tahoma, system-ui, sans-serif; line-height: 1.6; color: var(--text,#16161A); background: var(--bg,#F5F5F7); width: 100%">
<sc-if value="{{isHome}}" hint-placeholder-val="{{true}}">
<dc-import name="Home" device="{{device}}" on-pick="{{pick}}" on-home="{{goHome}}" on-track="{{goTrack}}" hint-size="100%,1500px"></dc-import>
</sc-if>
<sc-if value="{{isCheckout}}" hint-placeholder-val="{{false}}">
<dc-import name="Checkout" device="{{device}}" sku="{{sku}}" on-submit="{{submit}}" on-home="{{goHome}}" hint-size="100%,1450px"></dc-import>
</sc-if>
<sc-if value="{{isPay}}" hint-placeholder-val="{{false}}">
<dc-import name="Pay" device="{{device}}" order="{{order}}" on-result="{{payResult}}" on-return="{{goTracking}}" on-home="{{goHome}}" hint-size="100%,1050px"></dc-import>
</sc-if>
<sc-if value="{{isTracking}}" hint-placeholder-val="{{false}}">
<dc-import name="Tracking" device="{{device}}" order="{{order}}" scenario="{{scenario}}" autoplay="{{autoplay}}" on-home="{{goHome}}" hint-size="100%,1350px"></dc-import>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"device":{"editor":"enum","options":["auto","desktop","mobile"],"default":"auto","section":"State"},"$preview":{"width":1366,"height":1500}}'>
class Component extends DCLogic {
  newId() {
    var d = '';
    var c = window.crypto;
    while (d.length < 13) {
      var b = new Uint8Array(16);
      c.getRandomValues(b);
      for (var i = 0; i < b.length && d.length < 13; i++) { if (b[i] < 250) d += String(b[i] % 10); }
    }
    var r = 0;
    for (var j = 0; j < 13; j++) r = (r * 10 + (d.charCodeAt(j) - 48)) % 997;
    return 'ORD-' + d + '-' + ('00' + r).slice(-3);
  }
  go(screen, extra) {
    this.setState(Object.assign({ screen: screen }, extra || {}));
    try { window.scrollTo(0, 0); } catch (e) {}
  }
  renderVals() {
    var self = this;
    var s = this.state || {};
    var screen = s.screen || 'home';
    if (!this._h) {
      this._h = {
        pick: function (sku) { self.go('checkout', { sku: sku }); },
        goHome: function () { self.go('home'); },
        goTrack: function () { self.go('tracking', { order: null, autoplay: false, scenario: 'success' }); },
        submit: function (o) { self.go('pay', { order: Object.assign({}, o, { id: self.newId() }) }); },
        payResult: function (sc) { self.setState({ scenario: sc }); },
        goTracking: function () { self.go('tracking', { autoplay: true }); }
      };
    }
    return Object.assign({
      device: this.props.device || 'auto',
      isHome: screen === 'home',
      isCheckout: screen === 'checkout',
      isPay: screen === 'pay',
      isTracking: screen === 'tracking',
      sku: s.sku || 'DIAMOND-1000',
      order: s.order || null,
      scenario: s.scenario || 'success',
      autoplay: !!s.autoplay
    }, this._h);
  }
}
</script>
</body>
</html>
